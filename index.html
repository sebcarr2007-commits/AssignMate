<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
 const firebaseConfig = {
 apiKey: "AIzaSyDsvCYABP8MWfbWOVIbZe1FYNfEgY5Asi0",
 authDomain: "assignmate-38dc3.firebaseapp.com",
 projectId: "assignmate-38dc3",
 storageBucket: "assignmate-38dc3.firebasestorage.app",
 messagingSenderId: "560275764867",
 appId: "1:560275764867:web:c8ffbad866a105c9cd0db6",
 measurementId: "G-JKJES9Y3X5"
};

 const KEY='assignmate-data-v1';
 const defaultClasses=['Physics Honors','Advanced Astrophysics','Spanish','Mathematics'];
 let data={classes:[],assignments:[]};
 let cloudEnabled=false;
 let currentUser=null;
 let db=null;

 const $=id=>document.getElementById(id);

 function generateId(){
   return (typeof crypto !== 'undefined' && crypto.randomUUID) 
     ? crypto.randomUUID() 
     : Date.now().toString(36) + Math.random().toString(36).substring(2);
 }

 function ensureAssignmentIds(){
   if(Array.isArray(data.assignments)){
     data.assignments.forEach(a => {
       if(!a.id) a.id = generateId();
     });
   }
 }

 function firebaseConfigured(){
   return firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('PASTE_') &&
          firebaseConfig.projectId && !firebaseConfig.projectId.includes('PASTE_');
 }

 async function initCloud(){
   if(!firebaseConfigured()){
     data=JSON.parse(localStorage.getItem(KEY)||'null')||{classes:defaultClasses,assignments:[]};
     const sync=$('syncStatus'); if(sync) sync.textContent='☁ Local mode';
     if(!Array.isArray(data.classes))data.classes=[];
     if(!Array.isArray(data.assignments))data.assignments=[];
     ensureAssignmentIds();
     render();
     toast('Cloud sync is not configured yet — using local data.');
     return;
   }

   try{
     firebase.initializeApp(firebaseConfig);
     db=firebase.firestore();
     const provider = new firebase.auth.GoogleAuthProvider();
     await firebase.auth().signInWithPopup(provider);
     currentUser = firebase.auth().currentUser;
     cloudEnabled=true;
     const sync=$('syncStatus'); if(sync) sync.textContent='☁ Synced across devices';

     const ref=db.collection('users').doc(currentUser.uid);
     const snap=await ref.get();
     if(snap.exists){
       data=snap.data();
       if(!Array.isArray(data.classes))data.classes=[];
       if(!Array.isArray(data.assignments))data.assignments=[];
     }else{
       data={classes:defaultClasses,assignments:[]};
       await ref.set(data);
     }
     ensureAssignmentIds();
     render();
     toast('Cloud sync connected ✓');
   }catch(err){
     console.error(err);
     data=JSON.parse(localStorage.getItem(KEY)||'null')||{classes:defaultClasses,assignments:[]};
     if(!Array.isArray(data.classes))data.classes=[];
     if(!Array.isArray(data.assignments))data.assignments=[];
     ensureAssignmentIds();
     render();
     toast('Cloud connection failed — using local data.');
   }
 }

 const localSave=()=>localStorage.setItem(KEY,JSON.stringify(data));

 async function save(){
   ensureAssignmentIds();
   localSave();
   if(cloudEnabled && currentUser){
     try{
       await db.collection('users').doc(currentUser.uid).set(data);
     }catch(err){
       console.error('Cloud save failed:',err);
       toast('Saved locally; cloud sync failed.');
     }
   }
 }

const todayStr=()=>{const d=new Date();return localDate(d)};
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function statusClass(s){return s==='Completed'?'completed':s==='In Progress'?'progress':'todo'}
function formatDate(s){if(!s)return '—';const [y,m,d]=s.split('-');return new Date(Number(y),Number(m)-1,Number(d)).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}

function populateClassSelects(){
 const el=$('className');const old=el.value;
 el.innerHTML=data.classes.length?data.classes.map(c=>`<option>${esc(c)}</option>`).join(''):'<option value="">Add a class first</option>';
 el.value=data.classes.includes(old)?old:(data.classes[0]||'');
}

function filtered(which){
 const pre=which===1?['filterClass','filterDate','filterStatus','search']:['aFilterClass','aFilterDate','aFilterStatus','aSearch'];
 const [classSort,dateSort,statusSort,q]=pre.map(x=>$(x).value.trim().toLowerCase());
 const result=data.assignments.filter(a=>
   !q || (a.title+' '+a.description+' '+a.className).toLowerCase().includes(q)
 );

 const getDateTime = a => `${a.dueDate}${a.dueTime || '23:59'}`;
 const getStatusGroup = a => (a.status === 'Completed' ? 1 : 0);

 return result.sort((a,b)=>{
   if(statusSort){
     const groupA = getStatusGroup(a);
     const groupB = getStatusGroup(b);
     if(groupA !== groupB){
       return statusSort === 'active' ? groupA - groupB : groupB - groupA;
     }
   }
   if(classSort){
     const cmp=a.className.localeCompare(b.className,undefined,{sensitivity:'base'});
     if(cmp!==0)return classSort==='asc'?cmp:-cmp;
   }
   if(dateSort){
     const cmp=getDateTime(a).localeCompare(getDateTime(b));
     if(cmp!==0)return dateSort==='asc'?cmp:-cmp;
   }
   return getDateTime(a).localeCompare(getDateTime(b));
 });
}

function formatTime(s){
 if(!s)return '';
 const [h,m]=s.split(':');
 const d=new Date();
 d.setHours(Number(h),Number(m),0,0);
 return d.toLocaleTimeString(undefined,{
   hour:'numeric',
   minute:'2-digit'
 });
}

function rowHTML(a){
 const due=a.status==='Completed'
    ? 'Completed'
    : formatDate(a.dueDate)+(a.dueTime?`<br><small>${formatTime(a.dueTime)}</small>`:'');
 const d=new Date(a.dueDate+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);const diff=Math.round((d-now)/86400000);
 const dueClass=a.status!=='Completed'?(diff<0?'overdue':diff<=0?'due-soon':''):'';
 return `<tr><td class="title-cell"><strong>${esc(a.title)}</strong><small>${esc(a.description||'No description')}</small></td><td><span class="class-pill">${esc(a.className)}</span></td><td class="${dueClass}">${due}${a.status!=='Completed'&&diff===0?'<br><small>Today</small>':''}</td><td><select class="status-select status ${statusClass(a.status)}" aria-label="Change status" onchange="changeStatus('${a.id}', this.value)">
<option ${a.status==='To Do'?'selected':''}>To Do</option>
<option ${a.status==='In Progress'?'selected':''}>In Progress</option>
<option ${a.status==='Completed'?'selected':''}>Completed</option>
</select></td><td><div class="actions"><button class="icon-btn" title="Edit" onclick="editAssignment('${a.id}')">✎</button><button class="icon-btn" title="Delete" onclick="deleteAssignment('${a.id}')">♲</button></div></td></tr>`
}

function renderRows(){
 const a1=filtered(1),a2=filtered(2);
 $('assignmentRows').innerHTML=a1.length?a1.map(rowHTML).join(''):'<tr><td colspan="5"><div class="empty"><strong>No assignments found</strong>Try changing your filters or create a new assignment.</div></td></tr>';
 $('assignmentRows2').innerHTML=a2.length?a2.map(rowHTML).join(''):'<tr><td colspan="5"><div class="empty"><strong>No assignments found</strong>Try changing your filters or create a new assignment.</div></td></tr>';
}

function renderClasses(){
 $('classList').innerHTML=data.classes.length?data.classes.map(c=>`<div class="class-item"><strong>${esc(c)}</strong><button title="Remove" onclick="removeClass('${encodeURIComponent(c)}')">✕</button></div>`).join(''):'<div class="empty">No classes yet.</div>';
}

function renderCalendar(){
 const now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=first.getDay();
 let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-head">${x}</div>`).join('');
 for(let i=0;i<start;i++)h+='<div class="cal-day"></div>';
 for(let day=1;day<=days;day++){
  const ds=localDate(new Date(y,m,day)),isToday=ds===todayStr(),tasks=data.assignments.filter(a=>a.dueDate===ds);
  h+=`<div class="cal-day ${isToday?'today':''}"><div class="cal-num ${isToday?'today-num':''}">${day}</div>${tasks.map(a=>`<div class="cal-task ${statusClass(a.status)}" title="${esc(a.title)}">${esc(a.title)}</div>`).join('')}</div>`;
 }
 $('calendarGrid').innerHTML=h;
}

function render(){
 ensureAssignmentIds();
 populateClassSelects();
 renderRows();
 renderClasses();
 renderCalendar();
}

function openModal(id=null){
 $('modal').classList.add('open');$('modalTitle').textContent=id?'Edit Assignment':'New Assignment';
 $('editId').value=id||'';const a=id&&data.assignments.find(x=>x.id===id);
 $('title').value=a?.title||'';
$('className').value=a?.className||data.classes[0]||'';
$('dueDate').value=a?.dueDate||todayStr();
$('dueTime').value=a?.dueTime||'';
$('status').value=a?.status||'To Do';
$('description').value=a?.description||'';
$('title').focus();
}

function closeModal(){$('modal').classList.remove('open')}

$('assignmentForm').addEventListener('submit',e=>{
 e.preventDefault();
 const id=$('editId').value;
 const obj={
  id:id||generateId(),
  title:$('title').value.trim(),
  className:$('className').value,
  dueDate:$('dueDate').value,
  dueTime:$('dueTime').value,
  status:$('status').value,
  description:$('description').value.trim()
 };
 if(!obj.className){toast('Add a class first.');return}
 if(id){
   const i=data.assignments.findIndex(a=>a.id===id);
   if(i!==-1) data.assignments[i]=obj;
   toast('Assignment updated.');
 }else{
   data.assignments.push(obj);
   toast('Assignment created.');
 }
 save();closeModal();render();
});

function changeStatus(id,status){
  const a=data.assignments.find(x=>x.id===id);
  if(!a)return;
  a.status=status;
  save();
  render();
  toast(`Status changed to ${status}.`);
}

function editAssignment(id){openModal(id)}

function deleteAssignment(id){
 const a=data.assignments.find(x=>x.id===id);
 if(!a) return;
 if(confirm(`Delete "${a.title}"?`)){
  data.assignments=data.assignments.filter(x=>x.id!==id);
  save();
  render();
  toast('Assignment deleted.');
 }
}

function addClass(){const input=$('newClass'),name=input.value.trim();if(!name)return;if(data.classes.some(c=>c.toLowerCase()===name.toLowerCase())){toast('That class already exists.');return}data.classes.push(name);data.classes.sort();input.value='';save();render();toast('Class added.')}
function removeClass(encoded){const c=decodeURIComponent(encoded);if(data.assignments.some(a=>a.className===c)){alert('This class is used by an assignment. Delete or edit those assignments first.');return}if(confirm(`Remove "${c}"?`)){data.classes=data.classes.filter(x=>x!==c);save();render()}}
$('classFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const names=reader.result.split(/[\r\n,]+/).map(x=>x.trim()).filter(Boolean);let added=0;names.forEach(n=>{if(!data.classes.some(c=>c.toLowerCase()===n.toLowerCase())){data.classes.push(n);added++}});data.classes.sort();save();render();toast(`Imported ${added} class${added===1?'':'es'}.`)};reader.readAsText(file);e.target.value='' });
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='assignmate-backup.json';a.click();URL.revokeObjectURL(url)}
$('backupFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.classes)||!Array.isArray(x.assignments))throw Error();data=x;ensureAssignmentIds();save();render();toast('Backup imported.')}catch{alert('That file is not a valid AssignMate backup.')}};r.readAsText(file);e.target.value=''});
function clearAll(){if(confirm('This will delete all assignments and classes from this browser. Continue?')){data={classes:[],assignments:[]};save();render();toast('All data cleared.')}}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(b.dataset.page).classList.add('active');if(b.dataset.page==='calendar')renderCalendar()}));
['filterClass','filterDate','filterStatus','search','aFilterClass','aFilterDate','aFilterStatus','aSearch'].forEach(id=>$(id).addEventListener('input',renderRows));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
initCloud();
</script>
